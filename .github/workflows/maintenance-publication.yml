name: Verify maintenance dashboard publication
on:
  workflow_run:
    workflows: [Continuous issue and PR triage, Continuous reader feedback, Reader correction review, Seminar reading brief]
    types: [completed]
    branches: [curriculum-v1.2]
permissions: {}
jobs:
  verify:
    if: github.event.workflow_run.name == 'Continuous issue and PR triage' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: read
    steps:
      # Read API metadata and the fixed dashboard only; no artifact/code execution.
      - name: Verify an actual dashboard update after AI execution
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_RUN: ${{ github.event.workflow_run.id }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          run = os.environ['REVIEW_RUN']
          assert run.isdecimal()
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + '/' + path], text=True))
          jobs = api('actions/runs/' + run + '/jobs?per_page=100')['jobs']
          if any(j['name'] == 'agent' and j['conclusion'] == 'success' for j in jobs):
              body = api('issues/27').get('body') or ''
              audit = re.escape('https://github.com/' + repo + '/actions/runs/' + run + '#maintenance-snapshot-') + r'[a-f0-9]{64}\b'
              assert re.search(audit, body), 'AI completed without publishing the run-specific snapshot audit link; inspect safe_outputs logs'
              print('Verified actual dashboard publication for run', run)
          else:
              print('No AI execution: no dashboard publication expected')
          PY

  recovery:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Show manual review and billing paths
        env:
          ORIGIN_RUN: ${{ github.event.workflow_run.id }}
        run: |
          {
            echo "Review the [failed execution](https://github.com/$GITHUB_REPOSITORY/actions/runs/$ORIGIN_RUN)."
            echo
            echo "The original feedback stays in the queue. Use [manual review, service limits and recovery](https://github.com/$GITHUB_REPOSITORY/blob/curriculum-v1.2/docs/review-recovery.ko.md)."
          } >> "$GITHUB_STEP_SUMMARY"
