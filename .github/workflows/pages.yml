name: Publish textbook
on:
  pull_request:
    branches: [curriculum-v1.2]
    paths: ['verso/**', '.github/workflows/pages.yml']
  push:
    branches: [curriculum-v1.2]
    paths: ['verso/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          lake-package-directory: verso
          auto-config: 'false'
          build: 'false'
      - run: python3 verso/build_site.py
      - run: python3 verso/check_study.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: verso/site/html-multi
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/curriculum-v1.2'
    needs: book
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
