name: Feedback automation tests
on:
  pull_request:
    branches: [curriculum-v1.2]
    paths: ['scripts/**', 'tests/**', '.github/workflows/**', 'verso/study.py', 'verso/static/study.js']
  push:
    branches: [curriculum-v1.2]
    paths: ['scripts/**', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: node --check verso/static/study.js
